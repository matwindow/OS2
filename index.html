<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MatOS 2.0</title><link rel="icon" type="image/png" href="icon.png"><meta name="description" content="Cool Browser OS!"><meta name="author" content="matwindow"><meta name="format-detection" content="telephone=no"><meta name="format-detection" content="date=no"><meta name="format-detection" content="address=no"><meta http-equiv="X-UA-Compatible" content="IE=edge">
<!--=========-->
<!--CSS Files-->
<!--=========-->
  <link rel="stylesheet" href="css/0000.css"><link rel="stylesheet" href="css/0001.css">
</head>
<body>
<!--=======================-->
<!--Programing Langs Config-->
<!--=======================-->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!--========-->
<!--TS Files-->
<!--========-->
  <script src="ts/check.ts" type="text/babel" data-presets="typescript"></script>
<!--========-->
<!--JS Files-->
<!--========-->
  <script src="js/check.js"></script><script src="js/taskbar-icons.js" defer></script><script src="js/right-click.js" defer></script>
<!--========-->
<!--ELEMENTS-->
<!--========-->
<div class="desktop">
  <div class="taskbar">
    <div class="icons"></div>
  </div>
  <div class="context-menu" id="context-menu">
    <button id="copy-file" menu-fileonly=true>Copy File</button>
    <button id="delete-file" menu-fileonly=true>Delete File</button>
    <button id="paste-file" menu-fileonly=false>Paste File</button>
    <button id="s-paste-file" menu-fileonly=false>Paste Shortcut To File</button>
    <div id="new-file" menu-fileonly=false><button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'txt',window.sys.user.desktop)">New File ➜</button><br>
      <div id="doc"><button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'txt',window.sys.user.desktop)">Document ➜</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'txt',window.sys.user.desktop)">.txt</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'matrtf',window.sys.user.desktop)">.matrtf</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'matdoc',window.sys.user.desktop)">.matdoc</button><br>
      </div>
      <div id="pic"><button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'matrect',window.sys.user.desktop)">Picture ➜</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'matrect',window.sys.user.desktop)">.matrect</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'png',window.sys.user.desktop)">.png</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'jpeg',window.sys.user.desktop)">.jpeg</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'jpg',window.sys.user.desktop)">.jpg</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'svg',window.sys.user.desktop)">.svg</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'ico',window.sys.user.desktop)">.ico</button><br>
      </div>
      <div id="app"><button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'txt',window.sys.user.desktop)">App ➜</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'matjs',window.sys.user.desktop)">.matjs</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'matexe',window.sys.user.desktop)">.matexe</button><br>
        <button menu-normal onclick="window.user.newfile(window.sys.user.now,'Unnamed File.'+'matcmd',window.sys.user.desktop)">.matcmd</button><br>
      </div>
    </div>    
  </div>
  <div id="bsod" style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background-color: var(--bsod-col, #0050ff);
    color: var(--bsod-text-col, #ffffff);
    font-family: var(--bsod-text-font, monospace);
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    text-align: left;
    overflow: hidden;
    padding: 40px;
    box-sizing: border-box;
  ">

    <p style="font-size:30vh;  line-height: 1; margin: 0 0 20vh 0;">:(</p>
    <p style="white-space: pre-line; line-height: 1; margin: 0;">
┌──────────┐       ██
└─┬───────┬┘       ██
┌─┴───────┴┐       ██
└─┬───────┬┘       ██
┌─┴───────┴┐       ▄▄
└──────────┘       ▀▀</p>
  </div>
</div>



</body>





</html>
